name: realme_launcher
description: Launcher ringan untuk Realme C3
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  device_apps: ^2.2.0        # ambil daftar aplikasi terinstall + ikon
  flutter_launcher_icons: ^0.13.1
  shared_preferences: ^2.2.2 # simpan setting user (grid size, favorit, dll)
  intl: ^0.19.0              # format jam & tanggal di home screen

flutter:
  uses-material-design: true
